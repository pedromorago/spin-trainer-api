name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Formato, tests unitarios, ArchUnit, integración con Testcontainers (Docker viene en el runner) y JaCoCo.
      - name: Check
        run: ./gradlew check

      - name: Lint del contrato
        run: npx --yes @redocly/cli@2 lint openapi.yaml

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports/
          retention-days: 14
