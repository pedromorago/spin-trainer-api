spring:
  application:
    name: spin-trainer-api
  threads:
    virtual:
      enabled: true
  # Two roles (ADR-0015): the API as spin_app, with minimal permissions; Flyway as spin_migrator, owner of the schema.
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER:spin_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${DB_URL}
    user: ${DB_MIGRATOR_USER:spin_migrator}
    password: ${DB_MIGRATOR_PASSWORD}
    schemas: app
    placeholders:
      app_role: ${DB_APP_USER:spin_app}
  jackson:
    # Optional fields without a value are omitted (the spec does not declare them nullable). Strict reading: JsonConfig.
    default-property-inclusion: non_null

server:
  shutdown: graceful

spin-trainer:
  auth:
    # Supabase project (https://<ref>.supabase.co). The API does not start without it.
    issuer: ${SUPABASE_URL}/auth/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
