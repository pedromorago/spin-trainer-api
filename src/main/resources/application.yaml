spring:
  application:
    name: spin-trainer-api
  threads:
    virtual:
      enabled: true
  jackson:
    # additionalProperties: false en la spec → un campo desconocido es un 400, no se ignora.
    deserialization:
      fail-on-unknown-properties: true
    # Los campos opcionales sin valor no se envían (la spec no los declara nullable).
    default-property-inclusion: non_null

server:
  shutdown: graceful

spin-trainer:
  auth:
    # Proyecto de Supabase (https://<ref>.supabase.co). Sin él la API no arranca.
    issuer: ${SUPABASE_URL}/auth/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
