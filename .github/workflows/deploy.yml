name: deploy

# Deploys the API to Render (ADR-0018) after a green CI on main, or by hand: builds the native image, pushes it to
# GHCR and triggers Render's deploy hook with that exact image, then waits until it answers. Without the
# RENDER_DEPLOY_HOOK_URL secret it only builds and pushes the image, so the workflow is harmless until Render is set up.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/spin-trainer-api
  API_URL: https://spin-trainer-api.onrender.com

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit CI validated, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GraalVM compiles the whole application: several minutes and a few GB of memory.
      - name: Native image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set: image pushed, nothing deployed (spin-trainer-web/docs/DEPLOY.md)."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK&imgURL=$(printf '%s' "$IMAGE:$TAG" | jq -sRr @uri)"
          # Flyway runs at startup: wrong database or issuer secrets fail here, not on the first user. The free
          # instance may also be waking up, so the check waits up to five minutes.
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors \
            "$API_URL/actuator/health/readiness"
