# Spin Trainer contract: source of truth (OpenAPI-first, ADR-0004). Changes from v0 and their reasons: ADR-0013.
openapi: 3.1.0
info:
  title: Spin Trainer API
  version: 0.2.0
  description: |
    Spin Trainer API: catalog of Spin & Go situations (3-max and HU), reference and custom ranges,
    Quiz attempts (immutable events) and aggregated statistics.

    - Authentication: JWT issued by Supabase Auth (`Authorization: Bearer`), verified against its JWKS.
    - Errors: Problem Details (RFC 9457, formerly RFC 7807) with a URN `type` `urn:spin-trainer:<type>`. Besides the
      statuses declared for each operation, any operation may respond 500 (`internal`) or 503 (`unavailable`: the
      JWT issuer is not responding; retryable) in the same format. They are not declared per operation so that
      validation against the spec keeps rejecting any other unexpected status.
    - Traceability: the optional `X-Correlation-Id` header is propagated to the logs and returned in the response
      (generated if absent) and in `Problem.correlationId`.
    - Caching: `/situations` and `/ranges/default*` change only with a seed migration; they respond with `ETag` and
      `Cache-Control: no-cache, private`, and with 304 if `If-None-Match` matches.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: situation
    description: Catalog of the 16 situations (situation module).
  - name: range
    description: Reference ranges (PDF, Flyway seed) and the user's custom ranges (range module).
  - name: quiz
    description: Quiz attempts as immutable events (quiz module).
  - name: stats
    description: Aggregate queries over the attempts (stats module).

paths:
  /situations:
    get:
      tags: [situation]
      operationId: listSituations
      summary: Situation catalog, in display order
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Situation' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ranges/default:
    get:
      tags: [range]
      operationId: listDefaultRanges
      summary: All loaded reference ranges (one entry per seeded situation and stack)
      description: Lets the client know which combinations have a range and train in random mode without N requests.
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Range' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ranges/default/{situation}/{stack}:
    parameters:
      - $ref: '#/components/parameters/situation'
      - $ref: '#/components/parameters/stack'
    get:
      tags: [range]
      operationId: getDefaultRange
      summary: Reference range for a situation and stack
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Range' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ranges/user:
    get:
      tags: [range]
      operationId: listUserRanges
      summary: All of the user's custom ranges
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Range' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ranges/user/{situation}/{stack}:
    parameters:
      - $ref: '#/components/parameters/situation'
      - $ref: '#/components/parameters/stack'
    get:
      tags: [range]
      operationId: getUserRange
      summary: The user's custom range
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Range' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown situation/stack or no custom range.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      tags: [range]
      operationId: putUserRange
      summary: Creates or replaces the custom range (optimistic concurrency by version)
      description: |
        `version` is required: `0` creates (409 if it already exists); `N` replaces version `N` (409 if it changed or was
        deleted). This way a write never silently overwrites another. Hands with the implicit action are dropped on save.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RangeWrite' }
            example: { hands: { AA: MR_4B_C, KK: MR_4B_C, '72o': FOLD }, version: 0 }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Range' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Range' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [range]
      operationId: deleteUserRange
      summary: Deletes the custom range (the reference range applies again). Idempotent.
      responses:
        '204': { description: Deleted or did not exist }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /quiz/attempts:
    post:
      tags: [quiz]
      operationId: recordAttempt
      summary: Records the answer to a Quiz hand
      description: |
        The client sends only what the user did. The server computes `expected` against the user's effective range at
        that moment (custom if it exists, otherwise the reference one; ADR-0012) and `correct`, and stores which range
        and version it came from (ADR-0006/0007). 422 if the situation/stack has no range.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptWrite' }
            example: { situation: btn_open, stack: 25, hand: A5s, given: MR_F_F }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/NoRange' }
    get:
      tags: [quiz]
      operationId: listAttempts
      summary: The user's attempts, newest first (cursor pagination)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: Opaque `nextCursor` value from the previous page., schema: { type: string } }
        - { name: situation, in: query, schema: { $ref: '#/components/schemas/SituationKey' } }
        - { name: stack, in: query, schema: { $ref: '#/components/schemas/Stack' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /stats/hands:
    get:
      tags: [stats]
      operationId: getHandStats
      summary: Attempts and correct answers aggregated by situation, stack and hand
      description: |
        Aggregation (GROUP BY) over the attempts. The study policy (hard hands, weights, rankings)
        is applied on the client over these rows (ADR-0013).
      parameters:
        - { name: situation, in: query, schema: { $ref: '#/components/schemas/SituationKey' } }
        - { name: stack, in: query, schema: { $ref: '#/components/schemas/Stack' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HandStat' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /stats/progress:
    get:
      tags: [stats]
      operationId: getProgress
      summary: Attempts and correct answers per day (only days with activity)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
        - { name: tz, in: query, description: IANA time zone for the day boundaries., schema: { type: string, default: UTC, example: Europe/Madrid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProgressDay' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  headers:
    ETag:
      description: Representation version. Send it back in `If-None-Match` to get 304 if it has not changed.
      schema: { type: string }

  parameters:
    situation:
      name: situation
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SituationKey' }
    stack:
      name: stack
      in: path
      required: true
      description: Effective stack in BB, canonical form without trailing zeros (`25`, `12.5`).
      schema: { $ref: '#/components/schemas/Stack' }

  responses:
    NotModified:
      description: No changes since the `ETag` sent in `If-None-Match`; the client reuses its copy.
    BadRequest:
      description: Invalid request (urn:spin-trainer:validation), with per-field details in `errors`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid JWT (urn:spin-trainer:unauthorized).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Unknown situation/stack or nonexistent resource (urn:spin-trainer:not-found).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The version sent is not the current one (urn:spin-trainer:conflict).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NoRange:
      description: The situation/stack has no range to grade against (urn:spin-trainer:no-range).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    SituationKey:
      type: string
      pattern: '^[a-z0-9_]+$'
      maxLength: 64
      example: btn_open
    Stack:
      type: number
      minimum: 1
      maximum: 100
      multipleOf: 0.5
      example: 12.5
    Hand:
      description: |
        Canonical hand of the 13×13 grid: a pair (`AA`) or high rank + low rank + `s`/`o` (`AKs`, `T9o`).
        The pattern rejects `AAs` or `AK`; the server validates the high→low order (`KAs` is not valid) (400).
      type: string
      pattern: '^(?:([AKQJT2-9])\1|([AKQJT2-9])(?!\2)[AKQJT2-9][so])$'
      example: AKs
    Action:
      type: string
      description: Compound action. One per hand and (situation, stack).
      enum: [MR_4B_C, MR_C_C, MR_C_F, MR_F_F, L_C_C, L_C_F, L_PUSH, L_F, ALLIN, 3BET, 3BET_C, CALL, CALL_VS_X2, ISO_C, ISO_F, LIMP, CHECK, FOLD]
      x-enum-varnames: [MR_4B_C, MR_C_C, MR_C_F, MR_F_F, L_C_C, L_C_F, L_PUSH, L_F, ALLIN, THREE_BET, THREE_BET_C, CALL, CALL_VS_X2, ISO_C, ISO_F, LIMP, CHECK, FOLD]
    Position:
      type: string
      enum: [BTN, SB, BB]
      description: In HU the button is the SB.
    PriorAction:
      type: object
      required: [position, action]
      additionalProperties: false
      properties:
        position: { $ref: '#/components/schemas/Position' }
        action: { type: string, enum: [FOLD, LIMP, MIN_RAISE, RAISE, THREE_BET, CALL, SHOVE] }
    Situation:
      type: object
      required: [key, label, format, hero, priorActions, stacks, actions]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/SituationKey' }
        label: { type: string }
        format: { type: string, enum: [3max, hu], description: Spin & Go only (ADR-0011). }
        hero: { $ref: '#/components/schemas/Position' }
        priorActions:
          type: array
          description: Actions before the hero's decision, in order. Empty if the hero opens.
          items: { $ref: '#/components/schemas/PriorAction' }
        stacks: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/Stack' } }
        actions:
          type: array
          minItems: 2
          uniqueItems: true
          description: Possible actions. The implicit one (unlisted hands) is FOLD, or CHECK if FOLD is not among them.
          items: { $ref: '#/components/schemas/Action' }
        notes: { type: string }
    Hands:
      type: object
      description: Hand → action. Absent hands have the implicit action.
      propertyNames: { $ref: '#/components/schemas/Hand' }
      additionalProperties: { $ref: '#/components/schemas/Action' }
      maxProperties: 169
    Range:
      type: object
      required: [situation, stack, hands, source, version]
      additionalProperties: false
      properties:
        situation: { $ref: '#/components/schemas/SituationKey' }
        stack: { $ref: '#/components/schemas/Stack' }
        hands: { $ref: '#/components/schemas/Hands' }
        source: { type: string, enum: [default, user] }
        version:
          type: integer
          minimum: 1
          description: In `default`, the seed version; in `user`, the version for optimistic concurrency.
        updatedAt: { type: string, format: date-time }
    RangeWrite:
      type: object
      required: [hands, version]
      additionalProperties: false
      properties:
        hands: { $ref: '#/components/schemas/Hands' }
        version: { type: integer, minimum: 0, description: 0 = create; N = the read version being replaced. }
    AttemptWrite:
      type: object
      required: [situation, stack, hand, given]
      additionalProperties: false
      properties:
        situation: { $ref: '#/components/schemas/SituationKey' }
        stack: { $ref: '#/components/schemas/Stack' }
        hand: { $ref: '#/components/schemas/Hand' }
        given: { $ref: '#/components/schemas/Action' }
    Attempt:
      type: object
      required: [id, situation, stack, hand, given, expected, correct, rangeSource, rangeVersion, answeredAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        situation: { $ref: '#/components/schemas/SituationKey' }
        stack: { $ref: '#/components/schemas/Stack' }
        hand: { $ref: '#/components/schemas/Hand' }
        given: { $ref: '#/components/schemas/Action' }
        expected: { $ref: '#/components/schemas/Action' }
        correct: { type: boolean }
        rangeSource: { type: string, enum: [default, user] }
        rangeVersion: { type: integer, minimum: 1 }
        answeredAt: { type: string, format: date-time }
    AttemptPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Attempt' } }
        nextCursor:
          type: [string, 'null']
          description: null on the last page.
          # Required even if null: the generated DTO always serializes it (the API omits the other nulls).
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.ALWAYS)'
    HandStat:
      type: object
      required: [situation, stack, hand, attempts, correct, lastAnsweredAt]
      additionalProperties: false
      properties:
        situation: { $ref: '#/components/schemas/SituationKey' }
        stack: { $ref: '#/components/schemas/Stack' }
        hand: { $ref: '#/components/schemas/Hand' }
        attempts: { type: integer, minimum: 1 }
        correct: { type: integer, minimum: 0 }
        lastAnsweredAt: { type: string, format: date-time }
    ProgressDay:
      type: object
      required: [date, attempts, correct]
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        attempts: { type: integer, minimum: 1 }
        correct: { type: integer, minimum: 0 }
    Problem:
      type: object
      description: Problem Details (RFC 9457).
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference, example: 'urn:spin-trainer:validation' }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        correlationId: { type: string }
        errors:
          type: array
          description: Only on 400. One item per invalid field.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: 'hands.AAs' }
              message: { type: string }
