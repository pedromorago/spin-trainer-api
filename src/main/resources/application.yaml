spring:
  application:
    name: spin-trainer-api
  threads:
    virtual:
      enabled: true
  # Dos roles (ADR-0015): la API como spin_app, con permisos mínimos; Flyway como spin_migrator, dueño del esquema.
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER:spin_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${DB_URL}
    user: ${DB_MIGRATOR_USER:spin_migrator}
    password: ${DB_MIGRATOR_PASSWORD}
    schemas: app
    placeholders:
      app_role: ${DB_APP_USER:spin_app}
  jackson:
    # Los campos opcionales sin valor no se envían (la spec no los declara nullable). Lectura estricta: JsonConfig.
    default-property-inclusion: non_null

server:
  shutdown: graceful

spin-trainer:
  auth:
    # Proyecto de Supabase (https://<ref>.supabase.co). Sin él la API no arranca.
    issuer: ${SUPABASE_URL}/auth/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
