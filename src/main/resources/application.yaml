spring:
  application:
    name: spin-trainer-api
  threads:
    virtual:
      enabled: true
  # Two roles (ADR-0015): the API as spin_app, with minimal permissions; Flyway as spin_migrator, owner of the schema.
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER:spin_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${DB_URL}
    user: ${DB_MIGRATOR_USER:spin_migrator}
    password: ${DB_MIGRATOR_PASSWORD}
    schemas: app
    placeholders:
      # The role the migrations GRANT to. Not the login user: behind Supabase's pooler that is spin_app.<project-ref>.
      app_role: ${DB_APP_ROLE:spin_app}
  jackson:
    # Optional fields without a value are omitted (the spec does not declare them nullable). Strict reading: JsonConfig.
    default-property-inclusion: non_null

server:
  # Platforms such as Render set PORT; locally and in the QA environment it is 8080.
  port: ${PORT:8080}
  shutdown: graceful

spin-trainer:
  auth:
    # Supabase project (https://<ref>.supabase.co). The API does not start without it.
    issuer: ${SUPABASE_URL}/auth/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# /actuator/info: the commit the image was built from (Dockerfile). The deploy waits until the new one answers.
info:
  app:
    revision: ${APP_REVISION:unknown}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
